<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{{title}} · roylab</title>
  <link rel="stylesheet" href="/games/tabletop/navigation.css">
  <link rel="stylesheet" href="/games/tabletop/arcade.css">
  <link rel="stylesheet" href="/games/tabletop/croc.css">
  <link rel="stylesheet" href="/games/tabletop/charades.css">
  <script defer src="/games/tabletop/croc.js"></script>
  <script defer src="/games/tabletop/charades.js"></script>
  <script defer src="/games/tabletop/quiz-data.js"></script>
  <script defer src="/games/tabletop/arcade.js"></script>
</head>
<body>
<main class="arcade">
  <header class="mast">
    <div class="brand"><span class="die" aria-hidden="true">⚄</span><h1><a href="/" aria-label="로이랩 홈">roylab</a> <span id="game-name">{{title}}</span></h1></div>
    <button type="button" class="screen-btn" id="fullscreen"><span class="corners" aria-hidden="true"></span><span>전체 화면</span></button>
  </header>
  <nav class="lab-tabs" aria-label="로이랩 메뉴">
    {{tabs}}
  </nav>
  <div class="game-area">
    <section class="game-panel" id="croc" aria-labelledby="tab-croc" hidden></section>
    <section class="game-panel" id="bingo" aria-labelledby="tab-bingo" hidden>
      <div class="draw-history"><div class="history-label">부른 순서 <span id="draw-count">0 / 25</span></div><ol id="draw-log" aria-label="부른 숫자 순서"></ol></div>
      <div class="bingo-stage">
        <div class="bingo-ball" id="ball"><span id="number" aria-live="off">빙고</span></div>
        <span id="bingo-notice" role="status"></span>
      </div>
      <div class="controls">
        <button type="button" class="btn" id="bingo-reset">다시</button>
        <button type="button" class="btn primary" id="draw">다음</button>
      </div>
    </section>
    <section class="game-panel" id="quiz" aria-labelledby="tab-quiz" hidden>
      <div class="quiz-settings"><label for="difficulty">난이도</label>
        <select id="difficulty"><option value="">전체</option><option>하</option><option>중</option><option>상</option></select>
        <span id="quiz-progress" class="quiz-progress"></span></div>
      <div class="quiz-card">
        <div class="quiz-meta" id="quiz-meta"></div>
        <div id="quiz-fit"><p id="quiz-text" aria-live="polite"></p></div>
        <a id="quiz-source" hidden target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="controls"><button type="button" class="btn primary" id="quiz-action">정답 보기</button></div>
    </section>
    <section class="game-panel" id="charades" aria-labelledby="tab-charades" hidden></section>
  </div>
  <aside class="rulebar" aria-label="게임 규칙"><strong>게임 규칙</strong><span id="rule"></span></aside>
</main>
</body>
</html>
